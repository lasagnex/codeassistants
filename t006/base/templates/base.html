<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}EBS Diagnostics{% endblock %}</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 24px; color: #222; }
    h1 { font-size: 20px; }
    h2 { font-size: 16px; margin-top: 28px; }
    table { border-collapse: collapse; margin-top: 8px; }
    th, td { border: 1px solid #bbb; padding: 5px 10px; font-size: 13px; text-align: left; }
    th { background: #eee; }
    a { color: #0645ad; }
    .online { color: #157f3b; font-weight: bold; }
    .offline { color: #999; }
    .active { color: #b00; font-weight: bold; }
    .warn { background: #ffe9e9; }
    .bar { margin-top: 16px; }
  </style>
</head>
<body>
  <div class="bar"><a href="/">&laquo; vehicle list</a></div>
  {% block body %}{% endblock %}
</body>
</html>
